name: CI

on:
  push:
    branches: [main, 'milestone/**']
  pull_request:

jobs:
  host-panel:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spikes/host-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/host-panel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run build
      - run: npm run check:nomock
      - run: npm run test:ui
      - run: npm run test:host
