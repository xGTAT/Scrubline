name: CI

on:
  push:
    branches: [main, 'milestone/**']
    tags: ['v*']
  pull_request:

jobs:
  host-panel:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spikes/host-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/host-panel/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run build
      - run: npm run check:nomock
      - run: npm run test:ui
      - run: npm run test:host
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: scrubline-panel-vsix
          path: spikes/host-panel/*.vsix
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: host-panel
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: spikes/host-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spikes/host-panel/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - name: Check tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: spikes/host-panel/*.vsix
          generate_release_notes: true
